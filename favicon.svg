<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  <text x="50" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="55" font-weight="900" fill="#7aa2f7" filter="url(#glow)">IB</text>
</svg>